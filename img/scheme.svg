<text x="40" y="830" class="tb">Выводы Waveshare ESP32-S3-ETH · GPIO из текущей прошивки</text>
<text x="40" y="855" class="pin">GPIO47 TX → TXD адаптера</text>
<text x="40" y="875" class="pin">GPIO48 RX → RXD адаптера</text>
<text x="40" y="895" class="pin">GPIO44 ← PTT SunSDR2 DX</text>
<text x="40" y="915" class="pin">GPIO43 ← защита усилителя</text>
<text x="395" y="855" class="pin">GPIO38 → реле 220 В · GPIO39 → плавный пуск</text>
<text x="395" y="875" class="pin">GPIO40 → реле PTT SunSDR2 DX</text>
<text x="395" y="895" class="pin">GPIO17 → реле PTT усилителя</text>
<text x="395" y="915" class="pin">GPIO18 → реле анодного напряжения</text>
<text x="845" y="855" class="pin">W5500: SCK GPIO13 · MISO GPIO12</text>
<text x="845" y="875" class="pin">MOSI GPIO11 · CS GPIO14</text>
<text x="845" y="895" class="pin">IRQ GPIO10 · RST GPIO9</text>
<text x="845" y="915" class="ts">SPI внутри платы → RJ45 → сеть</text>
<text x="40" y="939" class="ts">GPIO33–37 заняты OPI PSRAM. GND контроллера и адаптера общая. Линии PTT показаны отдельно от сети TCI.</text>
