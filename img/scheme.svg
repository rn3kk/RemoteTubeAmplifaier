<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-label="Схема контроллера: браузер через роутер Wi-Fi обращается к ESP32; ESP32 по шине DATA управляет тремя сервоприводами STS3215, которые вращают КПЕ, вариометр и переключатель БМЗ; через модули реле включает сеть, плавный пуск, PTT и анодное напряжение усилителя; от трансивера получает PTT, от усилителя — сигналы защиты и наличия анодного." class="scheme"><style>
